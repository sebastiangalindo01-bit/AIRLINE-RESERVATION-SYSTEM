<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"> <!--Hace que los caracteres especiales se muestren correctamente en la página -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Hace que la página sea responsive, es decir, que se adapte a diferentes tamaños de pantalla -->
        <meta name="description" content="Registro de cliente para la aplicación de gestión de vuelos y paquetes turísticos.">
        <title>Registro de Cliente</title>
        <link rel="stylesheet" href="../../assets/css/pages/auth.css">
    </head>
    <body>
        <main>  
        <form id="forCliente">
            <h1>👤Registro de cliente</h1>

            <label for="tipo_documento">Tipo de Documento*</label ><br>
            <select id="tipo_documento" name="tipo_documento" required>
                <option value="">Seleccione una opción</option>
                <option value="Cedula">Cédula de Ciudadanía</option>
                <option value="Pasaporte">Pasaporte</option>
            </select><br><br>

            <label for="numero_identificacion">Número de Identificación*</label><br>
            <input type="text" id="numero_identificacion" name="numero_identificacion" required><br><br>

            <label for="nombre">Nombres*</label><br>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="apellido">Apellidos*</label><br>
            <input type="text" id="apellido" name="apellido" required><br><br>

            <label for="email">Correo electrónico*</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="telefono">Número de Teléfono*</label><br>
            <input type="tel" id="telefono" name="telefono" required><br><br>

            <label for="telefono_alterno">Teléfono Alterno</label><br>
            <input type="tel" id="telefono_alterno" name="telefono_alterno"><br><br>

            <label for="password">Contraseña*</label><br>
            <input type="password" id="password" name="password" required><br><br>

            <label for="confirm_password">Confirmar Contraseña*</label><br>
            <input type="password" id="confirm_password" name="confirm_password" required><br><br>

            <hr>

            <label for="direccion_residencia">Dirección de Residencia*</label><br>
            <input type="text" id="direccion_residencia" name="direccion_residencia" required><br><br>

            <label for="pais">País*</label><br>
            <select id="pais" name="pais" required>
                <option value="">Seleccione el país de residencia</option>
                <option value="Colombia">Colombia</option>
                <option value="Estados Unidos">Estados Unidos</option>
                <option value="España">España</option>
                <option value="Brasil">Brasil</option>
                <option value="Francia">Francia</option>
            </select><br><br>

            <label for="departamento_estado">Departamento/Estado*</label><br>
            <select id="departamento_estado" name="departamento_estado" required>
                <option value="">Seleccione el departamento o estado de residencia</option>
                <option value="Antioquia">Antioquia</option>
                <option value="Cundinamarca">Cundinamarca</option>
                <option value="Valle del Cauca">Valle del Cauca</option>
                <option value="Santander">Santander</option>
                <option value="Bolivar">Bolívar</option>
                <option value="Atlantico">Atlántico</option>
                <option value="Risaralda">Risaralda</option>
                <option value="Nariño">Nariño</option>
                <option value="Huila">Huila</option>
                <option value="Tolima">Tolima</option>
            </select><br><br>   

            <label for="ciudad">Ciudad*</label><br>
            <input type="text" id="ciudad" name="ciudad" required><br><br>  

            <a href="login.html">¿Ya tienes cuenta? Inicia sesión aquí</a><br><br> <!--Enlace a la página de login -->


            <button type="submit">👤Crear Cuenta</button>
        </form>
        </main>
    </body>
</html>
