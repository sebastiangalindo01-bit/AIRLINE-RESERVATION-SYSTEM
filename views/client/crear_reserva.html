<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formulario de Reserva - Airline Reservation System</title>
	<link rel="stylesheet" href="../../assets/css/base.css">
	<link rel="stylesheet" href="../../assets/css/layout.css">
	<link rel="stylesheet" href="../../assets/css/components.css">
	<link rel="stylesheet" href="../../assets/css/pages/cliente.css">
</head>
<body>
	<header class="navbar-principal">
		<div class="navbar-container">
			<div class="logo-section">
				<div class="logo">✈️</div>
				<div class="logo-text">
					<h1>Airline Reservation System</h1>
					<p>Tu viaje comienza aquí</p>
				</div>
			</div>
		</div>
	</header>

	<main class="main-content-buscar">
		<section class="reserva-container reserva-form-wrapper">
			<div class="reserva-step-header">
				<h2>Formulario de Reserva</h2>
				<p>Completa la información para continuar con tu reserva.</p>
			</div>

			<form id="formCrearReserva" class="reserva-form" action="#" method="post" novalidate>
				<div class="reserva-form-grid">
					<div class="form-group">
						<label for="tipoDocumento">Tipo de documento</label>
						<select id="tipoDocumento" name="tipoDocumento" required>
							<option value="">Seleccionar</option>
							<option value="cedula">Cédula</option>
							<option value="pasaporte">Pasaporte</option>
						</select>
					</div>

					<div class="form-group">
						<label for="numeroDocumento">Número de documento</label>
						<input type="text" id="numeroDocumento" name="numeroDocumento" placeholder="Ej: 123456789" required>
					</div>

					<div class="form-group">
						<label for="nombres">Nombres</label>
						<input type="text" id="nombres" name="nombres" placeholder="Ej: Ana María" required>
					</div>

					<div class="form-group">
						<label for="apellidos">Apellidos</label>
						<input type="text" id="apellidos" name="apellidos" placeholder="Ej: Gómez Pérez" required>
					</div>

					<div class="form-group">
						<label for="correo">Correo electrónico</label>
						<input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
					</div>

					<div class="form-group">
						<label for="telefono">Teléfono principal</label>
						<input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required>
					</div>

					<div class="form-group">
						<label for="telefonoAlterno">Teléfono alterno</label>
						<input type="tel" id="telefonoAlterno" name="telefonoAlterno" placeholder="Opcional">
					</div>

					<div class="form-group">
						<label for="fechaNacimiento">Fecha de nacimiento</label>
						<input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
					</div>

					<div class="form-group form-group-full">
						<label for="direccion">Dirección de residencia</label>
						<input type="text" id="direccion" name="direccion" placeholder="Ej: Calle 10 # 20-30" required>
					</div>

					<div class="form-group">
						<label for="pais">País</label>
						<select id="pais" name="pais" required>
							<option value="">Seleccionar</option>
							<option value="colombia">Colombia</option>
							<option value="ecuador">Ecuador</option>
							<option value="peru">Perú</option>
						</select>
					</div>

					<div class="form-group">
						<label for="departamento">Departamento / Estado</label>
						<select id="departamento" name="departamento" required>
							<option value="">Seleccionar</option>
							<option value="cundinamarca">Cundinamarca</option>
							<option value="antioquia">Antioquia</option>
							<option value="bolivar">Bolívar</option>
						</select>
					</div>

					<div class="form-group">
						<label for="ciudad">Ciudad</label>
						<select id="ciudad" name="ciudad" required>
							<option value="">Seleccionar</option>
							<option value="bogota">Bogotá</option>
							<option value="medellin">Medellín</option>
							<option value="cartagena">Cartagena</option>
						</select>
					</div>
				</div>

				<div class="reserva-actions">
					<button id="btnVolverReserva" type="button" class="btn btn-secondary">Volver</button>
					<button id="btnContinuarReserva" type="submit" class="btn btn-primary">Continuar</button>
				</div>
			</form>
		</section>
	</main>

	<footer class="footer">
		<p>&copy; 2026 Airline Reservation System. Todos los derechos reservados.</p>
	</footer>

	<script src="../../assets/js/crear_reserva.js" defer></script>
</body>
</html>
